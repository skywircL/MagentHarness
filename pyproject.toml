[project]
name = "magent-harness"
version = "0.1.0"
description = "Agent harness for the Magent document workbench: ReAct loop, context compaction, memory, human-in-the-loop suspend/resume, and identity-scoped tool permissions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
deepseek = ["httpx>=0.28,<1"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use real CJK punctuation in user queries.
"tests/*" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
packages = ["magent_harness"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
